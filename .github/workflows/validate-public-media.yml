name: Validate public YouTube media

"on": [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compile validator
        run: python3 -m py_compile scripts/validate_public_media.py

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Validate public media packages
        run: python3 scripts/validate_public_media.py
